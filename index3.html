<!doctype html>
<html lang="en-US">
  <!-- umschließt den gesamten Inhalt der gesamten Seite und wird manchmal als Root-Element bezeichnet. -->
  <head>
    <!-- Container für alle Dinge, die Sie auf der HTML-Seite aufnehmen möchten, die nicht der Inhalt sind, den Sie den Betrachtern Ihrer Seite zeigen. -->
    <meta charset="utf-8" />
    <!-- Es gibt keinen Grund, dies nicht zu setzen-->
    <meta name="viewport" content="width=device-width" />
    <!-- verhindert, dass mobile Browser Seiten breiter als die Ansicht rendern und sie dann verkleinern.-->
    <title>My test page</title>
    <!--Titel, der im Browser-Tab erscheint, in dem die Seite geladen wird. Es wird auch verwendet, um die Seite zu beschreiben, wenn Sie sie als Lesezeichen/Favorit speichern.-->
    <link href="styles/style-ext.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--Element enthält alle Inhalte, die Sie Webnutzer zeigen möchten-->
    <h1>My main title</h1>
    <img
      src="images/firefox-icon.png"
      alt="Das Firefox-Logo: ein flammender Fuchs, der die Erde umgibt."
    />
    <!-- Einige HTML-Elemente haben auch Attribute, die zusätzliche Einstellungen oder Informationen über das Element enthalten — siehe zum Beispiel charset, name und src in unserem Codebeispiel. -->
    <!-- 4 heading levels: -->
    <h2>My top level heading</h2>
    <h3>My subheading</h3>
    <h4>My sub-subheading</h4>
    <p>At Mozilla, we're a global community of</p>
    <ul>
      <li>technologists</li>
      <li>thinkers</li>
      <li>builders</li>
    </ul>

    <p-border>working together …</p-border>

    <p>
      Read the
      <a href="https://www.mozilla.org/en-US/about/manifesto/">
        Mozilla Manifesto
      </a>
      to learn even more about the values and principles that guid the pursuit
      of our mission.
      <!-- href steht für hypertext reference -->
    </p>
  </body>
</html>
